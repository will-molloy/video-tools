runs:
  using: composite
  steps:
    - name: Install ffmpeg
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Check fixtures
      shell: bash
      run: tests/fixtures/gen.sh --check

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
