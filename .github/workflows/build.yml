name: build
run-name: build by @${{ github.actor }}

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-ml
      - uses: ./.github/actions/build-tui
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Opens or updates the release PR, and releases it once merged.
      # PRs opened by GITHUB_TOKEN don't trigger CI, so close and reopen the release PR to run checks.
      - name: Release
        uses: googleapis/release-please-action@v5.0.0
