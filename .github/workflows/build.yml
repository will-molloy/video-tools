name: build
run-name: build by @${{ github.actor }}

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-ml
      - uses: ./.github/actions/build-tui
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: [ build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for version/tag/release

      - name: Bump version
        id: version
        uses: paulhatch/semantic-version@v6.0.7

      - name: Create GitHub tag and release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
