[package]
name = "video-tools"
edition = "2024"

[[bin]]
name = "vt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time"] }
tokio-util = "0.7.20"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
