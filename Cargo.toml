[package]
name = "video-tools"
edition = "2024"

[[bin]]
name = "vt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }
