[project]
name = "vt-ml"
version = "0.1.0"
description = "The machine-learning stages of vt"
requires-python = ">=3.12,<3.13"
dependencies = [
  # laion-clap, a SAM Audio dependency, caps numpy below 2.
  "numpy>=1.26.4",
  "soundfile>=0.14.0",
]

# Each stage's model is an extra, so the `fake` backends, and CI, install no ML stack. A model's
# extra goes with one GPU extra, `rocm` or `cuda`, which picks the torch build.
[project.optional-dependencies]
whisper = [
  "torch==2.11.0",
  "transformers>=5.20.1",
]
sam = [
  "sam-audio",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  # Each torchcodec release is built against one torch minor version.
  "torchcodec>=0.11.1,<0.12",
  "torchvision==0.26.0",
]
tiger = [
  "huggingface-hub>=0.36.0",
  "safetensors>=0.7.0",
  "torch==2.11.0",
]
rocm = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  "triton-rocm",
]
cuda = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
]

[project.scripts]
vt-ml = "vt_ml.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "rocm" }, { extra = "cuda" }]]
# perception-models (a SAM Audio dependency) imports xformers at module level but never calls it
# on the audio path, and xformers has no ROCm kernels for RDNA4. `sam.py` stubs the import instead.
override-dependencies = ["xformers; sys_platform == 'never'"]

[tool.uv.sources]
sam-audio = { git = "https://github.com/facebookresearch/sam-audio", rev = "bb4c6999d2677c7402360e426afc01ddfad6dce0" }
torch = [
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cuda", extra = "cuda" },
]
torchaudio = [
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cuda", extra = "cuda" },
]
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }

# ROCm 7.2 is the newest index with a torchaudio build, which pins torch to 2.11.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

# CUDA 12.8 supports NVIDIA's GPUs from Turing (RTX 20) to Blackwell (RTX 50).
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
